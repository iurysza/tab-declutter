<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tab Declutter promotional tile</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 440px;
    height: 280px;
    overflow: hidden;
    background: radial-gradient(420px 280px at 20% 0%, #4f46e5 0%, #312e81 70%, #1e1b4b 100%);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .tile { height: 100%; padding: 36px 34px; display: flex; flex-direction: column; justify-content: space-between; }
  .mark { width: 56px; height: 56px; filter: drop-shadow(0 8px 20px rgb(15 10 60 / 0.5)); }
  h1 { margin: 0; font-size: 40px; font-weight: 750; letter-spacing: -0.04em; line-height: 1; }
  p { margin: 10px 0 0; font-size: 17px; line-height: 1.35; color: rgb(255 255 255 / 0.82); max-width: 330px; }
</style>
</head>
<body>
  <div class="tile">
    <img class="mark" src="icon-src.svg" alt="" />
    <div>
      <h1>Tab Declutter</h1>
      <p>AI tab groups for Chrome, with your own API key.</p>
    </div>
  </div>
</body>
</html>
